name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install WebView2
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'MicrosoftEdgeWebview2Setup.exe'
          Start-Process -FilePath 'MicrosoftEdgeWebview2Setup.exe' -ArgumentList '/install' -NoNewWindow -Wait
        shell: pwsh
        continue-on-error: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app
        run: npm run tauri build
        env:
          TAURI_SKIP_DEVSERVER_CHECK: true

      - name: Upload installer (MSI)
        uses: actions/upload-artifact@v4
        with:
          name: worship-projector-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

      - name: Upload installer (NSIS EXE)
        uses: actions/upload-artifact@v4
        with:
          name: worship-projector-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
